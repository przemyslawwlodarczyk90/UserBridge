spring.main.allow-bean-definition-overriding=true
n# Every value needed by tests is defined here (no .env required in CI)

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

auth.jwt.secret=test-secret-key-test-secret-key-test-secret-key
auth.jwt.expirationDays=1
auth.jwt.issuer=UserBridgeTest

app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.password-reset.expiration-minutes=30

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@userbridge.local
spring.mail.password=test
