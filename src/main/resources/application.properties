# =====================================================================
#  UserBridge - main configuration
#  All environment-specific values and secrets live in the `.env` file
#  (see `.env.example`). This file only contains placeholders
#  (non-secret ones have safe defaults after the colon: ${VAR:default}).
# =====================================================================

# Load variables from .env located in the working directory (optional - real
# environment variables work too and take precedence in production).
spring.config.import=optional:file:.env[.properties]

spring.application.name=UserBridge

# --- Application URLs ------------------------------------------------
# Frontend address - used in e-mail links (account confirmation, password reset)
app.frontend-url=${APP_FRONTEND_URL}
# Comma separated list of origins allowed to call the API (CORS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
# Password reset link lifetime in minutes
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# --- JWT -------------------------------------------------------------
auth.jwt.secret=${JWT_SECRET}
auth.jwt.expirationDays=${JWT_EXPIRATION_DAYS:7}
auth.jwt.issuer=${JWT_ISSUER:UserBridge}

# --- Datasource ------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# --- Docker Compose (auto start of PostgreSQL from compose.yaml) -----
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.lifecycle-management=start-only

# --- Mail (SMTP) -----------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Thymeleaf (e-mail templates) ------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# --- Swagger / OpenAPI -----------------------------------------------
# UI: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.userbridge.infrastructure.api
