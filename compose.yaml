# PostgreSQL for local development.
# Values come from the .env file in the project root (docker compose reads it automatically).
services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - userbridge-pgdata:/var/lib/postgresql/data

volumes:
  userbridge-pgdata:
